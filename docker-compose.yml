
services:
  students_db:
    container_name: students_db
    image: postgres:16
    volumes: 
      - students_pg_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=students_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - 5433:5432

volumes:
  students_pg_data: